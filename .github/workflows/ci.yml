name: CI

on:
  push:
    branches: [ main, master, minimal ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Plists & Strings
        run: |
          plutil -lint Resources/Info.plist Resources/PrivacyInfo.xcprivacy Resources/CallCaption.entitlements Resources/*.lproj/*.strings Resources/*.lproj/*.stringsdict

      - name: Build
        run: ./build.sh

      - name: Test
        run: ./test.sh

      - name: Test (ThreadSanitizer)
        run: SANITIZE=thread ./test.sh
